# Builds the Windows installer on every push to main (download it from the run's Artifacts:
# Longitude-windows-installer) and publishes a GitHub Release with Longitude-Setup.exe attached when a tag like
# v0.1.0 is pushed. The installer bundles background removal (onnxruntime-web and the Fast model, fetched and
# SHA-256 checked by tools/fetch_model.py), so it works offline right after install. 'check' runs first: the app
# is plain files with no build step, so the module check and the tests are the only gate before a release.
# How to cut a release: docs/DESKTOP.md.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Top level, not only per job: a job-level grant alone has not been enough to publish releases (Sundial's build).
permissions:
  contents: write

# One build per branch or tag at a time, so two pushes to main never race on the Cargo.lock commit.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs (the comment names the version). A moving tag like @v2 lets whoever
# controls that repo run code in a job that can publish release assets. To move one: look up the new tag's commit,
# for example `git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>^{}'` (without `^{}` for a
# lightweight tag), then change the SHA and the comment together. GitHub's own actions/* stay on their major tags.

jobs:
  # The module link check and the test suite, plus a few things a release depends on.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.2"

      - name: Module check (every import resolves)
        run: deno run --allow-read tools/check.mjs

      - name: Tests
        run: deno test --allow-read tests/

      - name: Python scripts compile
        shell: bash
        run: python3 -m py_compile serve.py tools/fetch_model.py src-tauri/stage_vendor.py src-tauri/make_art.py

      # The app compares its own version with the latest release's tag once a day (web/js/app/desktop.js). A tag that
      # differs from the version inside the build would offer every install an "update" to the version it already has.
      - name: The tag matches the app's version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          VER=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json", encoding="utf-8"))["version"])')
          if [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VER in src-tauri/tauri.conf.json (tag v$VER, or bump the version: docs/DESKTOP.md)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $VER"

  windows:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm install

      # Background removal for the installer: the runtime and the Fast model, about 82 MB. The download is cached
      # under the hash of config.js (which holds every URL, size and SHA-256), and fetch_model.py checks each file
      # against config.js whether it came from the cache or the network.
      - name: Restore the background remover
        id: bgcache
        uses: actions/cache/restore@v4
        with:
          path: web/vendor
          key: bgremove-${{ hashFiles('web/js/features/bgremove/config.js') }}

      - name: Fetch the background remover (SHA-256 checked)
        run: |
          python tools/fetch_model.py --models fast --quiet
          if ($LASTEXITCODE -ne 0) { throw "fetch_model.py failed with exit code $LASTEXITCODE" }
          python tools/fetch_model.py --check
          if ($LASTEXITCODE -ne 0) { throw "fetch_model.py --check found a problem (exit code $LASTEXITCODE)" }

      - name: Cache the background remover
        if: steps.bgcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: web/vendor
          key: bgremove-${{ hashFiles('web/js/features/bgremove/config.js') }}

      # Moves exactly the runtime and the Fast model into src-tauri/vendor/ (bundle.resources) and removes
      # web/vendor/, which would otherwise be compiled into the program as a second copy.
      - name: Stage the background remover for the installer
        run: |
          python src-tauri/stage_vendor.py --move
          if ($LASTEXITCODE -ne 0) { throw "stage_vendor.py failed" }

      # Same command tauri-action runs, but with the compiler's complaints turned into annotations (readable through
      # the public API; the web log viewer needs a login). On tags tauri-action then rebuilds from the warm cache and
      # does the release.
      - name: Compile (errors as annotations)
        shell: bash
        run: |
          set -o pipefail
          if ! npm run tauri build 2>&1 | tee build.log; then
            # strip color codes, then annotate the compiler errors and the end of the log
            sed -r "s/$(printf '\033')\[[0-9;?]*[ -\/]*[@-~]//g" build.log > plain.log
            { grep -nE "^(error|warning: unused)" -A 14 plain.log | head -160; echo "----- tail -----"; tail -n 70 plain.log; } | paste -sd '|' - | fold -w 1200 | head -10 | while IFS= read -r chunk; do echo "::error::${chunk}"; done
            exit 1
          fi

      # Proof that the promise on the release page holds: the installer carries the model and the runtime. 7-Zip reads
      # NSIS installers; when it cannot (it does not list the program itself), the check is skipped with a warning.
      - name: Check the installer carries background removal
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer in src-tauri/target/release/bundle/nsis" }
          Write-Host ("{0}: {1:N1} MB" -f $exe.Name, ($exe.Length / 1MB))
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            Write-Host "::warning::7-Zip is not on this runner; the bundled files were not checked."
            exit 0
          }
          $list = (& 7z l $exe.FullName) | Out-String
          if ($LASTEXITCODE -ne 0 -or $list -notmatch "longitude\.exe") {
            Write-Host "::warning::7-Zip could not list the files in $($exe.Name); the bundled files were not checked."
            exit 0
          }
          foreach ($f in @("manifest.json", "isnet-general-int8.onnx", "ort.wasm.min.mjs", "ort-wasm-simd-threaded.wasm")) {
            if (-not $list.Contains($f)) { throw "the installer does not contain $f (src-tauri/vendor/ was not bundled)" }
          }
          Write-Host "The installer carries the background remover."
          exit 0

      # The release body is the annotated tag's message (git tag -a vX.Y.Z -m "what changed"), followed by the
      # install note below. Multiline, so it goes through the GITHUB_OUTPUT heredoc form.
      - name: Release notes from the tag message
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch --tags --force || true
          delim="NOTES_$RANDOM$RANDOM"
          {
            echo "body<<$delim"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Build installer and release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ format('Longitude {0}', github.ref_name) }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            **Install (Windows 10 and 11)**

            Download `Longitude-Setup.exe` and run it. It installs for your Windows account only, so no admin password is needed, and adds Longitude to the Start menu (and the desktop, if you leave that box ticked). Background removal is included: the Fast model works offline right after install. Best is an optional download inside the app.

            Longitude isn't signed with a paid certificate yet, so Windows doesn't know it. If Edge says the file "isn't commonly downloaded": Keep, then Show more, then Keep anyway. If a blue box says "Windows protected your PC": More info, then Run anyway. If Smart App Control blocked it, don't change any settings; that PC needs a signed build.

            **Updates:** once a day Longitude asks GitHub whether a newer release is out and, if so, shows a Download button that opens this page. Install the new version over the old one; your designs stay. To turn the check off: Settings > General > Updates, or "Automatic update checks on or off" in the command palette (Ctrl K).
          releaseDraft: false
          # Must stay a regular release: GitHub's /releases/latest (the in-app update check) skips pre-releases.
          prerelease: false
          includeUpdaterJson: false

      # A second copy of the installer under a fixed name, so one link always serves the newest build:
      # https://github.com/zphat/Longitude/releases/latest/download/Longitude-Setup.exe
      - name: Copy the installer to Longitude-Setup.exe
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer in src-tauri/target/release/bundle/nsis" }
          Copy-Item $exe.FullName Longitude-Setup.exe
          Write-Host "Copied $($exe.Name) to Longitude-Setup.exe"

      - name: Attach Longitude-Setup.exe to the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: Longitude-Setup.exe
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: Longitude-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Pin what this build resolved, so releases stop drifting with the day's newest crates. The only commit this
      # workflow ever makes; [skip ci] keeps it from starting another build.
      - name: Commit Cargo.lock
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then echo "Cargo.lock unchanged"; exit 0; fi
          git commit -m "Cargo.lock from the CI build [skip ci]"
          git push || { git pull --rebase && git push; } || echo "::warning::Cargo.lock was not pushed (main moved on); the next build tries again."
