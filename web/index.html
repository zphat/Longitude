<!doctype html>
<html lang="en" data-theme="signal" data-scheme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Longitude</title>
    <meta name="description" content="Make YouTube thumbnails and Spotify covers on your own computer. Free, open source, no account." />
    <meta name="theme-color" content="#090b0d" />
    <meta name="color-scheme" content="dark light" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preload" href="fonts/ui/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/ui/syne.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/ui/spacemono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="modulepreload" href="js/main.js" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/draw.css" />
    <link rel="stylesheet" href="css/inspector.css" />
    <!-- css/export.css and css/mods.css load with the dialogs they style (js/ui/dom.js loadStyle). -->
  </head>
  <body class="booting">
    <div id="app" class="app">
      <div id="stage" aria-label="Canvas"></div>
      <header id="topbar" class="topbar" data-tip-place="bottom"></header>
      <nav id="rail" class="rail" aria-label="Tools" data-tip-place="right"></nav>
      <aside id="panel" class="panel island" aria-label="Properties and layers" data-tip-place="left">
        <div id="inspector" class="inspector-host"></div>
        <div id="panel-splitter" class="panel-splitter"></div>
        <div id="layers" class="layers-host"></div>
      </aside>
      <div id="zoombar" class="zoombar" data-tip-place="top"></div>
    </div>
    <div id="home" hidden></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
    <div id="menu-root" class="menu-root"></div>
    <div id="modal-root" class="modal-root"></div>
    <div id="tip-root" class="tip-root" aria-hidden="true"></div>

    <div id="boot" class="boot" aria-hidden="true">
      <!-- The Longitude mark (brand/longitude-logo-ui.svg), as js/ui/shell.js logoMark draws it. -->
      <svg class="boot-mark logo-mark" viewBox="0 0 24 24" width="44" height="44">
        <defs>
          <radialGradient id="boot-mark-shade" gradientUnits="userSpaceOnUse" cx="-7.03" cy="-14.06" r="44.06"><stop offset=".46" stop-color="#5c5b55" /><stop offset=".54" stop-color="#363631" /><stop offset=".64" stop-color="#1e1f1b" /><stop offset=".8" stop-color="#131410" /><stop offset="1" stop-color="#0e0f0b" /></radialGradient>
          <linearGradient id="boot-mark-lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbee30" /><stop offset=".14" stop-color="#d7fa3e" /><stop offset=".8" stop-color="#d6fa3c" /><stop offset="1" stop-color="#c2ec22" /></linearGradient>
        </defs>
        <circle cx="12" cy="12" r="11.6" fill="url(#boot-mark-shade)" />
        <path fill="url(#boot-mark-lime)" d="M12,0.49C7.49,0.66 3.75,5.48 3.75,12C3.75,18.91 8.06,23.51 12,23.51C7.72,23.51 2.25,19.11 2.25,12C2.25,6.06 6.04,0.87 12,0.49ZM12,0.49C10.46,0.81 8.25,4.81 8.25,12C8.25,20.72 11.45,23.51 12,23.51C11.4,23.51 6.75,20.81 6.75,12C6.75,5.5 9.21,1.16 12,0.49ZM12,0.49C12.75,1.54 12.75,9.53 12.75,12C12.75,20.22 12.17,23.21 12,23.51C11.83,23.21 11.25,20.22 11.25,12C11.25,9.53 11.25,1.54 12,0.49ZM12,0.49C14.79,1.16 17.25,5.5 17.25,12C17.25,20.81 12.6,23.51 12,23.51C12.55,23.51 15.75,20.72 15.75,12C15.75,4.81 13.54,0.81 12,0.49ZM12,0.49C17.96,0.87 21.75,6.06 21.75,12C21.75,19.11 16.28,23.51 12,23.51C15.94,23.51 20.25,18.91 20.25,12C20.25,5.48 16.51,0.66 12,0.49Z" />
        <circle cx="12" cy="12" r="11.25" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="0.7" />
      </svg>
    </div>

    <div id="fatal" class="fatal" role="alert" hidden>
      <div class="fatal-card">
        <svg class="fatal-mark logo-mark" viewBox="0 0 24 24" width="40" height="40" aria-hidden="true">
          <defs>
            <radialGradient id="fatal-mark-shade" gradientUnits="userSpaceOnUse" cx="-7.03" cy="-14.06" r="44.06"><stop offset=".46" stop-color="#5c5b55" /><stop offset=".54" stop-color="#363631" /><stop offset=".64" stop-color="#1e1f1b" /><stop offset=".8" stop-color="#131410" /><stop offset="1" stop-color="#0e0f0b" /></radialGradient>
            <linearGradient id="fatal-mark-lime" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbee30" /><stop offset=".14" stop-color="#d7fa3e" /><stop offset=".8" stop-color="#d6fa3c" /><stop offset="1" stop-color="#c2ec22" /></linearGradient>
          </defs>
          <circle cx="12" cy="12" r="11.6" fill="url(#fatal-mark-shade)" />
          <path fill="url(#fatal-mark-lime)" d="M12,0.49C7.49,0.66 3.75,5.48 3.75,12C3.75,18.91 8.06,23.51 12,23.51C7.72,23.51 2.25,19.11 2.25,12C2.25,6.06 6.04,0.87 12,0.49ZM12,0.49C10.46,0.81 8.25,4.81 8.25,12C8.25,20.72 11.45,23.51 12,23.51C11.4,23.51 6.75,20.81 6.75,12C6.75,5.5 9.21,1.16 12,0.49ZM12,0.49C12.75,1.54 12.75,9.53 12.75,12C12.75,20.22 12.17,23.21 12,23.51C11.83,23.21 11.25,20.22 11.25,12C11.25,9.53 11.25,1.54 12,0.49ZM12,0.49C14.79,1.16 17.25,5.5 17.25,12C17.25,20.81 12.6,23.51 12,23.51C12.55,23.51 15.75,20.72 15.75,12C15.75,4.81 13.54,0.81 12,0.49ZM12,0.49C17.96,0.87 21.75,6.06 21.75,12C21.75,19.11 16.28,23.51 12,23.51C15.94,23.51 20.25,18.91 20.25,12C20.25,5.48 16.51,0.66 12,0.49Z" />
          <circle cx="12" cy="12" r="11.25" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="0.7" />
        </svg>
        <h1 class="fatal-title">Longitude could not start</h1>
        <p class="fatal-text">Something went wrong while loading. Your saved designs are safe in this browser. Reloading usually fixes it. Safe mode starts without mods and without reopening your last design.</p>
        <div class="fatal-actions">
          <a class="btn primary" href="./">Reload</a>
          <a class="btn ghost" href="./?safe">Start in safe mode</a>
          <a class="btn ghost" href="./?nosw">Reload without the offline cache</a>
        </div>
        <details class="fatal-details">
          <summary>Details for a bug report</summary>
          <pre data-detail></pre>
        </details>
      </div>
    </div>

    <noscript>
      <div class="fatal"><div class="fatal-card"><h1 class="fatal-title">Longitude needs JavaScript</h1><p class="fatal-text">Turn on JavaScript for this site, then reload.</p></div></div>
    </noscript>

    <script type="module">
      (async () => {
        // ?nosw has to work even when the cached app cannot start, so the
        // offline cache goes before main.js loads.
        if (new URLSearchParams(location.search).has("nosw") && "serviceWorker" in navigator) {
          try {
            for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
            for (const k of await caches.keys()) if (/^longitude-(shell|data|next)-/.test(k)) await caches.delete(k);
          } catch {}
        }
        await import("./js/main.js");
      })().catch((err) => {
        console.error(err);
        document.getElementById("boot")?.remove();
        const box = document.getElementById("fatal");
        box.querySelector("[data-detail]").textContent = String((err && (err.stack || err.message)) || err);
        box.hidden = false;
      });
    </script>
  </body>
</html>
