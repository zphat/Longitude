[package]
name = "longitude"
version = "0.1.0"
description = "Longitude: thumbnails and covers, made on your computer"
authors = ["zphat"]
edition = "2021"
license = "MIT"
repository = "https://github.com/zphat/Longitude"
rust-version = "1.77"

[lib]
name = "longitude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
